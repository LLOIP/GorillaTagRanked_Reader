
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "GTC Rank Presence" --icon "gtc_app.ico" --add-data "bronze.png;." --add-data "silver.png;." --add-data "gold.png;." --add-data "platinum.png;." --add-data "ruby.png;." --add-data "sapphire.png;." --add-data "gtc_logo.png;." app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GTC-Rank-Presence-Windows
          path: dist/GTC Rank Presence.exe
          if-no-files-found: error
